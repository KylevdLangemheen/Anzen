services:
  anzen-bot:
    build: .
    container_name: anzen-bot
    restart: unless-stopped
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - POSTGRESQL_HOST=${POSTGRESQL_HOST}
      - POSTGRESQL_USER=${POSTGRESQL_USER}
      - POSTGRESQL_PW=${POSTGRESQL_PW}
    depends_on:
      anzen-db:
        condition: service_healthy
    networks:
      - anzen-network
  anzen-db:
    image: postgres:18
    container_name: anzen-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRESQL_USER}
      - POSTGRES_PASSWORD=${POSTGRESQL_PW}
      - POSTGRES_DB=db_anzen
    volumes:
      - anzen-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d db_anzen"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - anzen-network
    ports:
      - "5432:5432"

networks:
  anzen-network:

volumes:
  anzen-db-data:
