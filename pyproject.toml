[build-system]
requires = ["setuptools>=80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "anzen"
dynamic = ["version"]
license = "AGPL-3.0-or-later"
description = "Share ban logs across partnered discord servers."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.4",
    "discord-py>=2.6.4",
    "psycopg[binary]>=3.3.3",
    "pydantic~=2.12.0",
    "sqlalchemy",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "ruff>=0.14.9",
    "isort>=7.0.0",
    "pyupgrade>=3.21.2",
]
